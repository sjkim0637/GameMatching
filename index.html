<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBTfNwe0ia9CN9gFCq2_G39Hea8aS9K9Nk",
  authDomain: "tingtongame.firebaseapp.com",
  databaseURL: "https://tingtongame-default-rtdb.firebaseio.com",
  projectId: "tingtongame",
  storageBucket: "tingtongame.firebasestorage.app",
  messagingSenderId: "322367917053",
  appId: "1:322367917053:web:d60ab1929672d2aec2a794",
  measurementId: "G-ECY6S8PH6C"
};
const firebaseApp = initializeApp(firebaseConfig);
const firebaseDB = getDatabase(firebaseApp);
window.tingtonFirebase = { firebaseDB, ref, get, set, onValue };
if (typeof window.load === "function") { window.load(); } else { window.addEventListener("DOMContentLoaded", () => window.load && window.load()); }
</script>
<script>
const GREEN="#1B5E45", GREEN_DARK="#123B2D", AMBER="#E8A33D", INK="#16231F", MUTED="#7C8B84";
const TIER_OPTIONS=["S","A","B","C","D","초심","왕초심"];
const TIER_COLOR={S:"#C24A3B",A:"#C2683B",B:"#B08900",C:"#1B5E45",D:"#3B6FA0","초심":"#7C8B84","왕초심":"#9A8B7C"};
const GENDER_COLOR={M:"#8B5CF6",F:"#D4A017"};
const STATUS_LABEL={waiting:"대기 중",resting:"쉬는 중",playing:"경기 중",queued:"다음 대기",grouped:"대기조"};

let players=[], courts=initCourts(2), overlap={}, tab="courts", overlapView="summary";
let newName="", newTier="B", newGender="M", isGuest=false, guestOf="", assigningCourtId=null, saveToRoster=true;
let members=[], newMemberName="", newMemberTier="B", newMemberGender="M";
let waitingGroups=[], isBuildingGroup=false, buildingGroupSelection=[];
let nextId=1, memberNextId=1, groupNextId=1, loaded=false;

function pairKey(a,b){return a<b?`${a}_${b}`:`${b}_${a}`}
function combinations(arr,k){
 const result=[],combo=[];
 function helper(start){
  if(combo.length===k){result.push([...combo]);return}
  for(let i=start;i<arr.length;i++){combo.push(arr[i]);helper(i+1);combo.pop()}
 }
 helper(0);return result;
}
function formatElapsed(ms){const total=Math.max(0,Math.floor(ms/1000));const m=Math.floor(total/60),s=total%60;return `${m}:${String(s).padStart(2,"0")}`}
function initCourts(n){return Array.from({length:n},(_,i)=>({id:i+1,playerIds:[],startTime:null,gameCount:0,nextPlayerIds:[]}))}
async function save(){
 if(!loaded || !window.tingtonFirebase)return;
 const fb=window.tingtonFirebase;
 try{
  await fb.set(fb.ref(fb.firebaseDB,"badminton_v1"),{players,courts,overlap,members,waitingGroups});
 }catch(e){
  console.error("Firebase 저장 실패:",e);
 }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function player(id){return players.find(p=>p.id===id)}
function genderColor(p){return p&&GENDER_COLOR[p.gender]||INK}
function tierBadge(p,small=false){return `<span class="${small?"tierBadgeSm":"tierBadge"}" style="color:${TIER_COLOR[p.tier]||MUTED}">${esc(p.tier)}</span>`}
function statusBadge(s){return `<span class="badge ${s}">${STATUS_LABEL[s]}</span>`}
function icon(name,size=14){return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`}

function addPlayer(){
 const name=newName.trim(); if(!name)return;
 if(isGuest&&!guestOf){alert("게스트를 데려온 회원을 선택해주세요.");return}
 let memberId=null;
 if(saveToRoster&&!isGuest){
  const existing=members.find(m=>m.name===name);
  if(existing){memberId=existing.id}
  else{const m={id:memberNextId++,name,tier:newTier,gender:newGender};members.push(m);memberId=m.id}
 }
 const p={id:nextId++,name,tier:newTier,gender:newGender,guestOf:isGuest?guestOf:null,memberId,games:0,status:"waiting",courtId:null,waitSince:Date.now()};
 players.push(p);newName="";isGuest=false;guestOf="";save();render();
}
function removePlayer(id){players=players.filter(p=>p.id!==id);save();render()}
function clearAllPlayers(){
 if(players.length===0)return;
 if(!confirm("오늘 참석자 명단을 전체 삭제할까요? (회원 명단은 그대로 유지돼요)"))return;
 players=[];
 courts=courts.map(c=>({...c,playerIds:[],nextPlayerIds:[],startTime:null}));
 waitingGroups=[];
 assigningCourtId=null;isBuildingGroup=false;buildingGroupSelection=[];
 save();render();
}
function addMember(){
 const name=newMemberName.trim(); if(!name)return;
 members.push({id:memberNextId++,name,tier:newMemberTier,gender:newMemberGender});
 newMemberName="";save();render();
}
function removeMember(id){members=members.filter(m=>m.id!==id);save();render()}
function addMemberToday(memberId){
 const m=members.find(x=>x.id===memberId);
 if(!m||players.some(p=>p.memberId===memberId))return;
 players.push({id:nextId++,name:m.name,tier:m.tier,gender:m.gender,guestOf:null,memberId:m.id,games:0,status:"waiting",courtId:null,waitSince:Date.now()});
 save();render();
}
function addAllMembersToday(){
 members.forEach(m=>{
  if(!players.some(p=>p.memberId===m.id)){
   players.push({id:nextId++,name:m.name,tier:m.tier,gender:m.gender,guestOf:null,memberId:m.id,games:0,status:"waiting",courtId:null,waitSince:Date.now()});
  }
 });
 save();render();
}
function toggleRest(id){
 players=players.map(p=>p.id!==id?p:(p.status==="waiting"?{...p,status:"resting"}:p.status==="resting"?{...p,status:"waiting",waitSince:Date.now()}:p));
 save();render();
}
function changeCourtCount(n){
 if(n===courts.length)return;
 if(n>courts.length){
  courts=[...courts,...Array.from({length:n-courts.length},(_,i)=>({id:courts.length+i+1,playerIds:[],startTime:null,gameCount:0,nextPlayerIds:[]}))];
 }else{
  const removed=courts.slice(n);
  if(removed.some(c=>c.playerIds.length>0)){alert("경기 중인 코트는 줄일 수 없어요. 먼저 게임을 종료해주세요.");return}
  courts=courts.slice(0,n);
 }
 save();render();
}
function finalizeAssignment(courtId,fourPlayers){
 const ids=fourPlayers.map(p=>p.id);
 courts=courts.map(c=>c.id===courtId?{...c,playerIds:ids,startTime:Date.now()}:c);
 players=players.map(p=>ids.includes(p.id)?{...p,status:"playing",courtId}:p);
 assigningCourtId=null;save();render();
}
function autoMatch(courtId){
 const waiting=players.filter(p=>p.status==="waiting");
 if(waiting.length<4){alert("대기 중인 선수가 4명 이상이어야 자동 배정할 수 있어요.");return}
 const sorted=[...waiting].sort((a,b)=>a.games-b.games||a.waitSince-b.waitSince);
 const pool=sorted.slice(0,Math.min(10,sorted.length)), combos=combinations(pool,4);
 let best=combos[0],bestScore=Infinity;
 for(const combo of combos){
  const gamesSum=combo.reduce((s,p)=>s+p.games,0);
  let overlapSum=0;
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)overlapSum+=getOverlap(combo[i].id,combo[j].id);
  const score=gamesSum*1000+overlapSum;
  if(score<bestScore){bestScore=score;best=combo}
 }
 finalizeAssignment(courtId,best);
}
function beginAssign(id){isBuildingGroup=false;assigningCourtId=id;render()}
function addToCourt(courtId,playerId){
 const court=courts.find(c=>c.id===courtId);
 if(!court||court.playerIds.length>=4||court.playerIds.includes(playerId))return;
 const ids=[...court.playerIds,playerId],starting=ids.length===4;
 courts=courts.map(c=>c.id===courtId?{...c,playerIds:ids,startTime:starting?Date.now():null}:c);
 players=players.map(p=>p.id===playerId?{...p,status:"playing",courtId}:p);
 if(starting)assigningCourtId=null;
 save();render();
}
function removeFromCourtPending(courtId,playerId){
 const court=courts.find(c=>c.id===courtId);
 if(court&&(court.nextPlayerIds||[]).includes(playerId)){
  courts=courts.map(c=>c.id===courtId?{...c,nextPlayerIds:c.nextPlayerIds.filter(id=>id!==playerId)}:c);
  players=players.map(p=>p.id===playerId?{...p,status:"waiting",courtId:null,waitSince:Date.now()}:p);
  save();render();
  return;
 }
 courts=courts.map(c=>c.id===courtId?{...c,playerIds:c.playerIds.filter(id=>id!==playerId)}:c);
 players=players.map(p=>p.id===playerId?{...p,status:"waiting",courtId:null,waitSince:Date.now()}:p);
 save();render();
}
function cancelAssign(courtId){
 const court=courts.find(c=>c.id===courtId);
 if(court){
  if(court.playerIds.length===4){
   const ids=court.nextPlayerIds||[];
   if(ids.length){
    players=players.map(p=>ids.includes(p.id)?{...p,status:"waiting",courtId:null,waitSince:Date.now()}:p);
    courts=courts.map(c=>c.id===courtId?{...c,nextPlayerIds:[]}:c);
   }
  }else if(court.playerIds.length>0){
   const ids=court.playerIds;
   players=players.map(p=>ids.includes(p.id)?{...p,status:"waiting",courtId:null,waitSince:Date.now()}:p);
   courts=courts.map(c=>c.id===courtId?{...c,playerIds:[],startTime:null}:c);
  }
 }
 assigningCourtId=null;save();render();
}
function endGame(courtId){
 const court=courts.find(c=>c.id===courtId);
 if(!court||court.playerIds.length!==4)return;
 const ids=court.playerIds;
 players=players.map(p=>ids.includes(p.id)?{...p,games:p.games+1,status:"waiting",courtId:null,waitSince:Date.now()}:p);
 const next={...overlap};
 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const k=pairKey(ids[i],ids[j]);next[k]=(next[k]||0)+1}
 overlap=next;
 const nextIds=court.nextPlayerIds||[];
 if(nextIds.length===4){
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:nextIds,nextPlayerIds:[],startTime:Date.now(),gameCount:c.gameCount+1}:c);
  players=players.map(p=>nextIds.includes(p.id)?{...p,status:"playing",courtId}:p);
 }else if(nextIds.length>0){
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:nextIds,nextPlayerIds:[],startTime:null,gameCount:c.gameCount+1}:c);
  players=players.map(p=>nextIds.includes(p.id)?{...p,status:"playing",courtId}:p);
  assigningCourtId=courtId;
 }else{
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:[],startTime:null,gameCount:c.gameCount+1}:c);
 }
 save();render();
}
function beginBuildGroup(){assigningCourtId=null;isBuildingGroup=true;buildingGroupSelection=[];render()}
function addToGroupBuilder(playerId){
 if(buildingGroupSelection.includes(playerId)||buildingGroupSelection.length>=4)return;
 buildingGroupSelection=[...buildingGroupSelection,playerId];
 players=players.map(p=>p.id===playerId?{...p,status:"grouped"}:p);
 if(buildingGroupSelection.length===4){
  waitingGroups.push({id:groupNextId++,playerIds:buildingGroupSelection});
  buildingGroupSelection=[];isBuildingGroup=false;
 }
 save();render();
}
function removeFromGroupBuilder(playerId){
 buildingGroupSelection=buildingGroupSelection.filter(id=>id!==playerId);
 players=players.map(p=>p.id===playerId?{...p,status:"waiting",waitSince:Date.now()}:p);
 save();render();
}
function cancelBuildGroup(){
 players=players.map(p=>buildingGroupSelection.includes(p.id)?{...p,status:"waiting",waitSince:Date.now()}:p);
 buildingGroupSelection=[];isBuildingGroup=false;save();render();
}
function disbandGroup(groupId){
 const g=waitingGroups.find(x=>x.id===groupId); if(!g)return;
 players=players.map(p=>g.playerIds.includes(p.id)?{...p,status:"waiting",courtId:null,waitSince:Date.now()}:p);
 waitingGroups=waitingGroups.filter(x=>x.id!==groupId);
 save();render();
}
function courtAcceptsGroup(c){return c.playerIds.length===0||(c.playerIds.length===4&&(!c.nextPlayerIds||c.nextPlayerIds.length===0))}
function assignGroupToCourt(groupId,courtId){
 const g=waitingGroups.find(x=>x.id===groupId),court=courts.find(c=>c.id===courtId);
 if(!g||!court||!courtAcceptsGroup(court))return;
 if(court.playerIds.length===0){
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:g.playerIds,startTime:Date.now()}:c);
  players=players.map(p=>g.playerIds.includes(p.id)?{...p,status:"playing",courtId}:p);
 }else{
  courts=courts.map(c=>c.id===courtId?{...c,nextPlayerIds:g.playerIds}:c);
  players=players.map(p=>g.playerIds.includes(p.id)?{...p,status:"queued",courtId}:p);
 }
 waitingGroups=waitingGroups.filter(x=>x.id!==groupId);
 save();render();
}
function getOverlap(a,b){return overlap[pairKey(a,b)]||0}
function waitingPlayers(){return players.filter(p=>p.status==="waiting").sort((a,b)=>a.waitSince-b.waitSince)}
function overlapRanking(){
 return Object.entries(overlap).map(([key,count])=>{
  const [a,b]=key.split("_").map(Number),pa=player(a),pb=player(b);
  return {a:pa,b:pb,count}
 }).filter(r=>r.a&&r.b&&r.count>0).sort((a,b)=>b.count-a.count)
}
function overlapByPlayer(){
 const rank=overlapRanking();
 return players.map(p=>{
  const related=rank.filter(r=>r.a.id===p.id||r.b.id===p.id).map(r=>({partner:r.a.id===p.id?r.b:r.a,count:r.count})).sort((x,y)=>y.count-x.count);
  return {player:p,related,maxCount:related[0]?.count||0}
 }).filter(r=>r.related.length).sort((a,b)=>b.maxCount-a.maxCount)
}

async function load(){
 try{
  const fb=window.tingtonFirebase;
  const gameRef=fb.ref(fb.firebaseDB,"badminton_v1");
  const snap=await fb.get(gameRef);
  if(snap.exists()){
   const d=snap.val()||{};
   players=Array.isArray(d.players)?d.players:[];
   courts=Array.isArray(d.courts)&&d.courts.length?d.courts:initCourts(2);
   overlap=d.overlap||{};
   members=Array.isArray(d.members)?d.members:[];
   waitingGroups=Array.isArray(d.waitingGroups)?d.waitingGroups:[];
   nextId=players.reduce((m,p)=>Math.max(m,Number(p.id)||0),0)+1;
   memberNextId=members.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;
   groupNextId=waitingGroups.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;
  }
  loaded=true;
  render();
  fb.onValue(gameRef,(snap)=>{
   if(!snap.exists())return;
   const d=snap.val()||{};
   players=Array.isArray(d.players)?d.players:[];
   courts=Array.isArray(d.courts)&&d.courts.length?d.courts:initCourts(2);
   overlap=d.overlap||{};
   members=Array.isArray(d.members)?d.members:[];
   waitingGroups=Array.isArray(d.waitingGroups)?d.waitingGroups:[];
   nextId=players.reduce((m,p)=>Math.max(m,Number(p.id)||0),0)+1;
   memberNextId=members.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;
   groupNextId=waitingGroups.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;
   loaded=true;
   render();
  });
 }catch(e){
  console.error("Firebase 불러오기 실패:",e);
  loaded=true;
  render();
 }
}
setInterval(()=>{
 document.querySelectorAll("[data-court-timer]").forEach(el=>{
  const id=Number(el.dataset.courtTimer),c=courts.find(x=>x.id===id);
  if(c?.startTime)el.textContent=formatElapsed(Date.now()-c.startTime);
 });
},1000);
// firebase 모듈 스크립트가 로드되기 전에도 화면 골격이 바로 보이도록 즉시 한 번 렌더링합니다.
render();
// firebase 모듈 스크립트가 초기화를 마치면 window.load()를 직접 호출해 실제 데이터를 불러옵니다.
// 만약 일정 시간 안에 연결되지 않으면(오프라인/네트워크 차단/잘못된 설정 등) 안내 배너를 보여줍니다.
setTimeout(()=>{
 if(!loaded){
  const app=document.getElementById("app");
  if(app) app.insertAdjacentHTML("afterbegin", `<div style="max-width:640px;margin:16px auto;padding:14px 16px;background:#FDF3F1;border:1px solid #F0D8D3;border-radius:12px;color:#C24A3B;font-size:13px;line-height:1.6">
   ⚠️ 저장소(Firebase)에 연결하지 못했어요. 아래를 확인해주세요.<br>
   1) 인터넷에 연결되어 있는지<br>
   2) 이 파일을 더블클릭해서 연 게 아니라 웹(Netlify, GitHub Pages 등)에 올려서 접속했는지 — 로컬 파일(file://)로 직접 열면 브라우저 보안 정책 때문에 저장 기능이 동작하지 않아요<br>
   3) 콘솔(F12)에 다른 에러 메시지가 있는지
   </div>`);
 }
},4000);
</script>
